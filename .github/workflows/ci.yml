name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version sync
        run: npm run check:version

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  release:
    needs: test
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version change
        id: version
        run: |
          set -euo pipefail

          extract_version() {
            sed -n 's/^version:[[:space:]]*"\(.*\)"/\1/p' "$1" | head -1
          }

          NEW_VERSION="$(extract_version ai-usage-observatory/config.yaml)"
          if [[ -z "$NEW_VERSION" ]]; then
            echo "Could not read version from ai-usage-observatory/config.yaml" >&2
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$NEW_VERSION" != "$PKG_VERSION" ]]; then
            echo "Version mismatch: config.yaml=$NEW_VERSION package.json=$PKG_VERSION" >&2
            exit 1
          fi

          OLD_VERSION=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD_VERSION="$(git show HEAD^:ai-usage-observatory/config.yaml 2>/dev/null | sed -n 's/^version:[[:space:]]*"\(.*\)"/\1/p' | head -1 || true)"
          fi

          echo "New version: $NEW_VERSION"
          echo "Old version: ${OLD_VERSION:-<none>}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Manual dispatch always rebuilds/republishes the current config version.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$NEW_VERSION" == "$OLD_VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version bumped on main → publish image (even if a git tag already exists
          # from a partial previous run). Tag is created only after a successful push.
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-usage-observatory/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nikolausstoll/ai-usage-observatory:latest
            ghcr.io/nikolausstoll/ai-usage-observatory:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image manifest
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/nikolausstoll/ai-usage-observatory:${VERSION}"
          docker buildx imagetools inspect "$IMAGE"
          echo "Verified $IMAGE is available for Home Assistant"

      - name: Create git tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — image republished successfully"
            exit 0
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Created tag $VERSION after successful image publish"
